name: RDP 16RAM

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (e.g. you@gmail.com)", required: true, default: "brahimlbrenss.github" }
      ts_api_key:         { description: "Tailscale API key (device admin, no Bearer)", required: true, default: "tskey-api-kroYEtuGFB21CNTRL-cZXDWpMQP4QcSLNcKA8X4QcwjUhuwU41" }
      ts_authkey:         { description: "Tailscale Auth key (reusable or ephemeral)", required: true, default: "tskey-auth-kxup96o8Hf11CNTRL-Njw8q82nUpjCwreTYU3MpjtazQP9SYy4G" }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime [The MAX RUNTIME : 359]", required: false, default: "359" }
      do_purge:           { description: "Purge bullet* devices at start (single instance only)", required: false, default: "true" }
      cycles:             { description: "0=stop after A; N=handoffs left incl this run", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10) [ignored if CRD provided]", required: false, default: "1" }
      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL containing --code="4/...".
          If provided -> single instance; CRD launches first.
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) { $n = 1 } else {
            $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 10) { $n = 10 }
          }

          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-2022
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 360
    env:
      RDP_USER: RDP
      RDP_PASS: ahmedD-7899

    steps:
      # --- CRD FIRST (prevent code timeout) ---
      - name: Set CRD flag early (safe read)
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV } else { "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV }
          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"

      - name: Install Chrome Remote Desktop Host (if missing)
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "CRD host not found, attempting install (EXE -> MSI fallback)..."
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            $ok = $false
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
              $ok = $true
            } catch {
              Write-Host "EXE installer failed or missing: $($_.Exception.Message)"
            }
            if (-not $ok) {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              try {
                Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
                Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
                Remove-Item $msi -Force
              } catch {
                Write-Error "CRD MSI fallback failed: $($_.Exception.Message)"
                exit 1
              }
            }
          } else {
            Write-Host "CRD host already installed."
          }

      - name: Run Chrome Remote Desktop (accept raw code / full cmd / url) with PIN
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          $pin = "${{ inputs.crd_pin }}".Trim()
          if ($pin -notmatch '^\d{6,12}$') { Write-Error "crd_pin must be 6–12 digits."; exit 1 }

          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $starter)) { Write-Error "remoting_start_host.exe not found."; exit 1 }

          $isFull = $false; $code = $null
          if ($raw -match 'remoting_start_host\.exe') { $isFull = $true }
          if ($raw -match '--code\s*=\s*"?([^"\s]+)') { $code = ([regex]::Match($raw,'--code\s*=\s*"?([^"\s]+)')).Groups[1].Value }
          elseif ($raw -match '^4\/') { $code = $raw }

          if ($code) {
            $redir = "https://remotedesktop.google.com/_/oauthredirect"
            $name  = $Env:COMPUTERNAME
            $args  = @("--code=""$code""","--redirect-url=""$redir""","--name=""$name""","--pin=""$pin""")
            Start-Process -FilePath $starter -ArgumentList $args
          } elseif ($isFull) {
            $tmp = "$env:TEMP\crd_full.ps1"
            Set-Content -Path $tmp -Value $raw -Encoding UTF8
            powershell -ExecutionPolicy Bypass -File $tmp
          } else {
            Write-Error "Could not detect CRD code."
            exit 1
          }
          Write-Host "CRD launch step completed with PIN."

      - name: Verify CRD registration (service + recent logs)
        if: env.CRD_ENABLED == '1'
        run: |
          $svcName = "Chrome Remote Desktop Service"
          $deadline = (Get-Date).AddSeconds(60)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            $svc = Get-Service -Name $svcName -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -in 'Running','StartPending') { $ok = $true; break }
            Start-Sleep -Seconds 3
          }
          if ($ok) { Write-Host "[$svcName] status: Running or starting." } else { Write-Warning "[$svcName] not running yet." }

          $logDir = "$env:ProgramData\Google\Chrome Remote Desktop"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter "host*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
              Write-Host "----- LOG: $($_.FullName) -----"
              Get-Content $_.FullName -Tail 200
            }
          } else { Write-Host "CRD log directory not found: $logDir" }

      # --- Continue with the rest after CRD is launched ---
      - name: Decide hostname + runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) { $hn = "bullet${{ matrix.id }}" } else { $hn = "bullet" }
          "TS_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV

          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          function IntOr($v,$d){ if("$v" -match '^\d+$'){ [int]$v } else { [int]$d } }
          $runtime = IntOr("${{ inputs.runtime_minutes }}",359)
          if (Yes("${{ inputs.quick_test }}")) { $runtime = 5 }
          if (-not (Yes("${{ inputs.quick_test }}")) -and $runtime -lt 6) { $runtime = 359 }
          if ($runtime -gt 360) { $runtime = 359 }
          "RUNTIME_MINUTES=$runtime" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Hostname: $hn  | Runtime: $runtime"

      # ---------- ENSURE STRONG CPU ----------
      - name: Ensure High-Performance CPU (Reject Weak Ones like Pentium/i3)
        run: |
          $cpu = Get-CimInstance Win32_Processor
          $name = $cpu.Name.Trim()
          $cores = $cpu.NumberOfCores
          $logCores = $cpu.NumberOfLogicalProcessors
          
          Write-Host "Detected CPU: $name"
          Write-Host "Physical Cores: $cores"
          Write-Host "Logical Cores: $logCores"
          
          if ($name -match "Pentium|Celeron|Atom|Core i3|i5") {
              Write-Error "Aborting run: Assigned a weak CPU ($name). GitHub will reschedule on a stronger host."
              exit 1
          } else {
              Write-Host "CPU is sufficiently strong ($name). Proceeding."
          }

      # ---------- ENSURE 16GB+ RAM ----------
      - name: Ensure 16GB+ RAM (Reject Low-Memory Hosts)
        run: |
          $ram = Get-CimInstance Win32_ComputerSystem
          $totalRAM = [math]::Round($ram.TotalPhysicalMemory / 1GB, 2)
          Write-Host "Detected RAM: $totalRAM GB"
          if ($totalRAM -lt 14) {
              Write-Error "Aborting run: Only $totalRAM GB RAM assigned. GitHub will reschedule on a 16GB+ host."
              exit 1
          }
          Write-Host "RAM OK ($totalRAM GB). Proceeding."

      # ---------- HIGH-PERFORMANCE POWER PLAN ----------
      - name: Force High-Performance Power Plan + Disable Sleep/Idle
        run: |
          # High Performance GUID
          $hp = "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"
          powercfg -setactive $hp
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -standby-timeout-ac 0
          powercfg -change -disk-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          powercfg -change -monitor-timeout-dc 0
          powercfg -change -standby-timeout-dc 0
          powercfg -hibernate off
          Write-Host "Power plan: High Performance. All sleep/idle timers = 0."

      # ---------- PURGE only for SINGLE INSTANCE ----------
      - name: Purge bullet* devices (single-instance only)
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          if (Yes("${{ inputs.do_purge }}")) {
            try {
              $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${{ inputs.ts_api_key }}:"))
              $tn = [uri]::EscapeDataString("${{ inputs.ts_tailnet }}")
              $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" -Headers @{ Authorization = "Basic $auth" }
              foreach($d in $list.devices){
                if ($d.hostname -match '^bullet[0-9]*$'){
                  Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers @{ Authorization = "Basic $auth" } -ErrorAction SilentlyContinue
                }
              }
              Write-Host "Purged bullet* devices (if any)."
            } catch { Write-Host "Purge warning: $($_.Exception.Message)" }
          } else {
            Write-Host "Purge disabled."
          }

      - name: Install + Up Tailscale (with --reset for clean direct path)
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout | Out-Null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-dns=true --accept-routes=true --reset
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Tailscale IPv4: $ip4"

      # ---------- TAILSCALE NETCHECK (log relay latency) ----------
      - name: Tailscale Netcheck (relay / direct path diagnostic)
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          Write-Host "===== TAILSCALE NETCHECK ====="
          & $ts netcheck
          Write-Host "============================="
          Write-Host "If you see high DERP latency above, Tailscale will relay your RDP traffic"
          Write-Host "and input will lag. Aim for 'Direct' path from your client (check with:"
          Write-Host "  tailscale status   -> peer line shows 'direct' or 'relay' ['derp-...'])."

      - name: Enable RDP user + firewall
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
            Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Write-Host "RDP ready. user=$u pass=$p host=$env:TS_HOSTNAME ip=$env:TAILSCALE_IP"

      # ---------- RDP PERFORMANCE TUNING (server-side, biggest input-lag wins) ----------
      - name: Apply RDP Performance Tuning (server-side)
        run: |
          # --- 1) RDP-Tcp: RDP Security Layer (not TLS/Negotiate) -> less per-packet overhead ---
          #     SecurityLayer: 0=Negotiate, 1=RDP (native), 2=TLS
          #     UserAuthentication (NLA): 0=off (skip extra round-trip at connect)
          #     MinEncryptionLevel: 1=ClientCompatible (lowest overhead)
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "SecurityLayer"            -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $tsPath -Name "UserAuthentication"       -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $tsPath -Name "MinEncryptionLevel"       -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $tsPath -Name "ColorDepth"               -Type DWord -Value 4 -Force  # 4 = 24-bit
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime"              -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime"     -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $tsPath -Name "MaxConnectionTime"        -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $tsPath -Name "fEnableRemoteFXAdvancedRemoteApp" -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $tsPath -Name "fDisableCam"              -Type DWord -Value 1 -Force  # disable camera redirect
          Set-ItemProperty -Path $tsPath -Name "fDisableAudioCapture"     -Type DWord -Value 1 -Force  # disable mic redirect
          Set-ItemProperty -Path $tsPath -Name "fDisableClip"             -Type DWord -Value 0 -Force  # keep clipboard
          Set-ItemProperty -Path $tsPath -Name "fEnableSmartCard"         -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $tsPath -Name "fDisablePNPRedir"         -Type DWord -Value 1 -Force  # disable PnP redirect
          Set-ItemProperty -Path $tsPath -Name "fDisableDefaultMainClientPrinter" -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $tsPath -Name "fDisableCcm"              -Type DWord -Value 1 -Force  # disable COM port redirect
          Set-ItemProperty -Path $tsPath -Name "fDisableLPT"              -Type DWord -Value 1 -Force  # disable LPT redirect
          Set-ItemProperty -Path $tsPath -Name "fEnableWindowsKey"        -Type DWord -Value 1 -Force  # keep Win key passthrough
          Write-Host "RDP-Tcp policies applied (SecurityLayer=RDP, NLA off, channels pruned)."

          # --- 2) Same keys on the live RDP-Tcp WMI provider (in case policy isn't read) ---
          try {
            $t = Get-CimInstance -ClassName "Win32_TSGeneralSetting" -Namespace "root\cimv2\TerminalServices" -Filter "TerminalName='RDP-Tcp'"
            if ($t) {
              Set-CimInstance -InputObject $t -Property @{ SecurityLayer = 1; UserAuthenticationRequired = $false; MinEncryptionLevel = 1 } -ErrorAction SilentlyContinue
            }
          } catch { Write-Host "WMI RDP-Tcp tune skipped: $($_.Exception.Message)" }

          # --- 3) Disable heavy visual effects for ALL users (default hive + RDP user if exists) ---
          $tuneHive = {
            param($root)
            $desk = "$root\Control Panel\Desktop"
            $metr = "$root\Control Panel\Desktop\WindowMetrics"
            $vx   = "$root\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
            # VisualFXSetting: 0=let-choose, 1=best-look, 2=best-performance, 3=custom
            New-Item -Path $vx -Force | Out-Null
            Set-ItemProperty -Path $vx -Name "VisualFXSetting" -Type DWord -Value 2 -Force
            # UserPreferencesMask 0x90,0x12,0x01,0x80 == "best performance" preset
            Set-ItemProperty -Path $desk -Name "UserPreferencesMask" -Type Binary -Value ([byte[]](0x90,0x12,0x01,0x80)) -Force
            Set-ItemProperty -Path $desk -Name "DragFullWindows"      -Type String -Value "0" -Force
            Set-ItemProperty -Path $desk -Name "FontSmoothing"        -Type String -Value "0" -Force
            Set-ItemProperty -Path $desk -Name "MenuShowDelay"        -Type String -Value "0" -Force
            Set-ItemProperty -Path $desk -Name "SmoothScroll"         -Type DWord -Value 0 -Force
            Set-ItemProperty -Path $metr -Name "MinAnimate"           -Type String -Value "0" -Force
            # Explorer-level toggles
            $adv = "$root\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
            New-Item -Path $adv -Force | Out-Null
            Set-ItemProperty -Path $adv -Name "ListviewAlphaSelect"   -Type DWord -Value 0 -Force
            Set-ItemProperty -Path $adv -Name "TaskbarAnimations"     -Type DWord -Value 0 -Force
            Set-ItemProperty -Path $adv -Name "IconsOnly"             -Type DWord -Value 1 -Force  # no thumbnails
            Set-ItemProperty -Path $adv -Name "DisablePreviewDesktop" -Type DWord -Value 1 -Force
            # DWM: disable composition extras where possible
            $dwm = "$root\Software\Microsoft\Windows\DWM"
            New-Item -Path $dwm -Force | Out-Null
            Set-ItemProperty -Path $dwm -Name "EnableAeroPeek"        -Type DWord -Value 0 -Force
          }

          # Default user (inherited by new logins)
          $defNt = "C:\Users\Default\NTUSER.DAT"
          if (Test-Path $defNt) {
            reg load "HKU\DefTune" $defNt | Out-Null
            & $tuneHive "HKU:\DefTune"
            [gc]::Collect()
            reg unload "HKU\DefTune" | Out-Null
            Write-Host "Default user profile tuned."
          }

          # RDP user profile if it already exists
          $rdpNt = "C:\Users\$env:RDP_USER\NTUSER.DAT"
          if (Test-Path $rdpNt) {
            reg load "HKU\RdpTune" $rdpNt | Out-Null
            & $tuneHive "HKU:\RdpTune"
            [gc]::Collect()
            reg unload "HKU\RdpTune" | Out-Null
            Write-Host "RDP user profile tuned."
          }

          # --- 4) Machine-wide: disable services that burn CPU on the runner ---
          # SysMain (Superfetch): keep disabled for predictable perf on short-lived runner
          foreach ($svc in @("SysMain","WSearch","DiagTrack","MapsBroker")) {
            try {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              Write-Host "Disabled service: $svc"
            } catch { Write-Host "Skip $svc : $($_.Exception.Message)" }
          }

          # --- 5) Restart TermService to pick up policy changes cleanly ---
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Write-Host "TermService restarted. RDP tuning complete."

      # ---------- GENERATE TUNED .RDP FILE AS ARTIFACT ----------
      - name: Generate tuned .rdp client file
        run: |
          $ip = $env:TAILSCALE_IP
          $rdp = @"
full address:s:$ip:3389
username:s:$env:RDP_USER
prompt for credentials:i:0
authentication level:i:0
session bpp:i:32
compression:i:1
keyboardhook:i:2
audiocapturemode:i:0
audiomode:i:0
redirectprinters:i:0
redirectcomports:i:0
redirectsmartcards:i:0
redirectclipboard:i:1
redirectposdevices:i:0
redirectdrives:i:0
disable wallpaper:i:1
disable full window drag:i:1
disable menu anims:i:1
disable themes:i:1
disable cursor setting:i:0
bitmapcachepersistenable:i:1
networkautodetect:i:1
bandwidthautodetect:i:1
connection type:i:7
displayconnection:i:0
alternate shell:s:
shell working directory:s:
"@
          $out = "$env:RUNNER_TEMP\bullet-tuned.rdp"
          Set-Content -Path $out -Value $rdp -Encoding UTF8
          "RDP_FILE=$out" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Tuned .rdp written to: $out"
          Write-Host "----- .rdp contents -----"
          Get-Content $out
          Write-Host "-------------------------"

      - name: Upload tuned .rdp file
        uses: actions/upload-artifact@v4
        with:
          name: bullet-tuned-rdp-${{ matrix.id }}
          path: ${{ env.RDP_FILE }}
          if-no-files-found: warn
          retention-days: 7

      - name: Display Hardware Info (CPU/RAM/Cores/IP)
        run: |
          Write-Host "===== HARDWARE INFORMATION ====="
          $cpu = Get-CimInstance Win32_Processor
          $ram = Get-CimInstance Win32_ComputerSystem
          $totalRAM = [math]::Round($ram.TotalPhysicalMemory / 1GB, 2)
          
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RAM (GB): $totalRAM"
          Write-Host "Processor (CPU): $($cpu.Name)"
          Write-Host "Cores: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RDP Target: $env:TAILSCALE_IP:3389  user=$env:RDP_USER"
          Write-Host "==============================="

      - name: Keep alive (to ${{ env.RUNTIME_MINUTES }} mins)
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            $mode = if ("$env:CRD_ENABLED" -eq '1') { '[CRD+RDP]' } else { '[RDP]' }
            Write-Host ("$mode Heartbeat " + (Get-Date).ToString("HH:mm:ss") + " ends at " + $end.ToString("HH:mm:ss"))
            Start-Sleep -Seconds 60
          }

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -gt 0) {
            $next = $cycles - 1
            if ($next -le 0) {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; base_prefix="bullet"; max_count="10"; dry_run="false" }
              $body = @{ ref="${{ github.ref_name }}"; inputs=$payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
              Write-Host "Dispatched STOP."
            } else {
              $payload = @{
                ts_tailnet      = "${{ inputs.ts_tailnet }}"
                ts_api_key      = "${{ inputs.ts_api_key }}"
                ts_authkey      = "${{ inputs.ts_authkey }}"
                quick_test      = "${{ inputs.quick_test }}"
                runtime_minutes = "${{ inputs.runtime_minutes }}"
                do_purge        = "${{ inputs.do_purge }}"
                cycles          = "$next"
                rdp_count       = "${{ inputs.rdp_count }}"
                crd_code        = "${{ inputs.crd_code }}"
                crd_pin         = "${{ inputs.crd_pin }}"
              }
              $url2 = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-B.yml/dispatches"
              $hdr2 = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body2 = @{ ref="${{ github.ref_name }}"; inputs=$payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url2 -Headers $hdr2 -Body $body2 | Out-Null
              Write-Host "Dispatched Workflow B with cycles=$next"
            }
          } else { Write-Host "No cycles configured. Done." }
