
name: RDP Performance Setup

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale auth key stored as a GitHub secret"
        required: true
        type: string
      runtime_minutes:
        description: "Runtime in minutes (1-359)"
        required: true
        default: "60"
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    # Requires your own Windows machine registered as a self-hosted runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      RUNTIME_INPUT: ${{ inputs.runtime_minutes }}

    steps:
      - name: Validate settings
        run: |
          $runtime = 0

          if (-not [int]::TryParse(
            $env:RUNTIME_INPUT,
            [ref]$runtime
          )) {
            throw "Runtime must be a number."
          }

          if ($runtime -lt 1 -or $runtime -gt 359) {
            throw "Runtime must be between 1 and 359 minutes."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure the TS_AUTHKEY repository secret."
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Optimize Windows responsiveness
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== WINDOWS PERFORMANCE SETUP ==="

          # Select High Performance only when available.
          $plans = powercfg /list | Out-String
          $highPerformance = '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c'

          if ($plans -match $highPerformance) {
            powercfg /setactive $highPerformance
            Write-Host "[OK] High Performance plan selected"
          } else {
            Write-Host "[INFO] Keeping the available power plan"
          }

          # Reduce visual effects for the runner's current user.
          $desktop = 'HKCU:\Control Panel\Desktop'
          $metrics = 'HKCU:\Control Panel\Desktop\WindowMetrics'
          $visual = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
          $personal = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'

          foreach ($path in @($visual, $personal)) {
            New-Item -Path $path -Force | Out-Null
          }

          Set-ItemProperty -Path $visual `
            -Name VisualFXSetting -Value 2 -Type DWord

          Set-ItemProperty -Path $personal `
            -Name EnableTransparency -Value 0 -Type DWord

          Set-ItemProperty -Path $desktop `
            -Name DragFullWindows -Value '0'

          Set-ItemProperty -Path $metrics `
            -Name MinAnimate -Value '0'

          # Keep Windows TCP autotuning at its normal setting.
          netsh int tcp set global rss=enabled
          netsh int tcp set global autotuninglevel=normal

          # Flush DNS cache; do not trim every process's working set.
          ipconfig /flushdns

          Write-Host "[OK] Performance settings applied"

      - name: Check system resources
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor

          $totalGB = [math]::Round(
            $os.TotalVisibleMemorySize / 1MB, 2
          )

          $freeGB = [math]::Round(
            $os.FreePhysicalMemory / 1MB, 2
          )

          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical processors: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "Total RAM: $totalGB GB"
          Write-Host "Free RAM: $freeGB GB"

      - name: Check Tailscale installation
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Install Tailscale on your Windows machine first."
          }

          $status = & $ts status
          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale is not connected. Check its configuration."
          }

          Write-Host $status

      - name: Keep runner job active
        run: |
          $end = (Get-Date).AddMinutes(
            [int]$env:RUNTIME_MINUTES
          )

          while ((Get-Date) -lt $end) {
            $remaining = [math]::Ceiling(
              ($end - (Get-Date)).TotalMinutes
            )

            Write-Host "Session active. Remaining minutes: $remaining"
            Start-Sleep -Seconds 60
          }

          Write-Host "Requested runtime completed."
