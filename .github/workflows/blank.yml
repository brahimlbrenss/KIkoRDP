name: RDP 16RAM

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
        default: "brahimlbrenss.github"
      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true
        default: "tskey-api-kroYEtuGFB21CNTRL-cZXDWpMQP4QcSLNcKA8X4QcwjUhuwU41"
      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
        default: "tskey-auth-kxup96o8Hf11CNTRL-Njw8q82nUpjCwreTYU3MpjtazQP9SYy4G"
      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime [MAX: 359]"
        required: false
        default: "359"
      do_purge:
        description: "Purge bullet* devices at start (single instance only)"
        required: false
        default: "true"
      cycles:
        description: "0=stop after A; N=handoffs left incl this run"
        required: false
        default: "0"
      rdp_count:
        description: "How many RDP instances (1-10) [ignored if CRD provided]"
        required: false
        default: "1"
      crd_code:
        description: "Paste raw CRD code (4/0AV...). If provided -> single instance."
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6-12 digits)"
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        shell: pwsh
        run: |
          $crd = '${{ inputs.crd_code }}'.Trim()
          if ($crd.Length -gt 0) {
            $n = 1
          } else {
            $n = [int]'${{ inputs.rdp_count }}'
            if ($n -lt 1) { $n = 1 }
            if ($n -gt 10) { $n = 10 }
          }

          $inc = @()
          for ($i = 1; $i -le $n; $i++) { $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-2022
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 360
    env:
      RDP_USER: RDP
      RDP_PASS: ahmedD-7899
      CRD_CODE_INPUT: ${{ inputs.crd_code }}
      CRD_PIN_INPUT: ${{ inputs.crd_pin }}
      RDP_COUNT_INPUT: ${{ inputs.rdp_count }}
      QUICK_TEST_INPUT: ${{ inputs.quick_test }}
      RUNTIME_INPUT: ${{ inputs.runtime_minutes }}

    steps:
      - name: Set CRD flag
        shell: pwsh
        run: |
          $crd = $env:CRD_CODE_INPUT.Trim()
          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "CRD_ENABLED=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"

      - name: Install Chrome Remote Desktop Host (if missing)
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            $ok = $false
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
              $ok = $true
            } catch {
              Write-Host "EXE installer failed: $($_.Exception.Message)"
            }
            if (-not $ok) {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
              Remove-Item $msi -Force
            }
          }

      - name: Run Chrome Remote Desktop with PIN
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |
          $raw = $env:CRD_CODE_INPUT.Trim()
          $pin = $env:CRD_PIN_INPUT.Trim()
          if ($pin -notmatch '^\d{6,12}$') {
            Write-Error "crd_pin must be 6-12 digits."
            exit 1
          }
          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          $redir = "https://remotedesktop.google.com/_/oauthredirect"
          $name  = $Env:COMPUTERNAME
          $args  = @("--code=`"$raw`"","--redirect-url=`"$redir`"","--name=`"$name`"","--pin=`"$pin`"")
          Start-Process -FilePath $starter -ArgumentList $args

      - name: Decide hostname + runtime
        shell: pwsh
        run: |
          $n = [int]$env:RDP_COUNT_INPUT
          if ($n -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          } else {
            $hn = "bullet"
          }
          "TS_HOSTNAME=$hn" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          function IntOr($v,$d){ if("$v" -match '^\d+$'){ [int]$v } else { [int]$d } }
          $runtime = IntOr($env:RUNTIME_INPUT, 359)
          if (Yes($env:QUICK_TEST_INPUT)) { $runtime = 5 }
          if (-not (Yes($env:QUICK_TEST_INPUT)) -and $runtime -lt 6) { $runtime = 359 }
          if ($runtime -gt 360) { $runtime = 359 }
          "RUNTIME_MINUTES=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ensure High-Performance CPU
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          $name = $cpu.Name.Trim()
          if ($name -match "Pentium|Celeron|Atom|Core i3|i5") {
              Write-Error "Aborting run: weak CPU ($name)."
              exit 1
          }

      - name: MAX Performance Tune
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # 1. Power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /hibernate off
          Write-Host "[OK] Power plan"

          # 2. Defender off (best-effort)
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch {}
          try { Set-MpPreference -DisableBehaviorMonitoring $true } catch {}
          try { Set-MpPreference -DisableIOAVProtection $true } catch {}
          try { Set-MpPreference -DisableScriptScanning $true } catch {}
          try { Set-MpPreference -MAPSReporting Disabled } catch {}
          try { Set-MpPreference -SubmitSamplesConsent NeverSend } catch {}
          try { Add-MpPreference -ExclusionPath "C:\" } catch {}
          try { Stop-Service -Name WinDefend -Force } catch {}
          try { Set-Service -Name WinDefend -StartupType Disabled } catch {}
          Write-Host "[OK] Defender best-effort"

          # 3. Heavy services off
          $svcs = @('SysMain','WSearch','DiagTrack','dmwappushservice','WdiServiceHost','WdiSystemHost','MapsBroker','lfsvc','RetailDemo','RemoteRegistry','Fax','SCardSvr','SensorService','PhoneSvc','CscService','DPS','DusmSvc')
          foreach ($s in $svcs) {
            try { Stop-Service -Name $s -Force } catch {}
            try { Set-Service -Name $s -StartupType Disabled } catch {}
          }
          Write-Host "[OK] Services"

          # 4. Windows Update off
          foreach ($s in @('wuauserv','UsoSvc','WaaSMedicSvc','Bits','DoSvc')) {
            try { Stop-Service -Name $s -Force } catch {}
            try { Set-Service -Name $s -StartupType Disabled } catch {}
          }
          Write-Host "[OK] WU off"

          # 5. TCP tuning
          netsh int tcp set global rss=enabled
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global timestamps=disabled
          netsh int tcp set heuristics disabled
          netsh int tcp set global initialRto=2
          netsh int tcp set global nonsackrttresiliency=disabled
          Get-NetAdapter | Where-Object { $_.Status -eq 'Up' } | ForEach-Object {
            try { Set-NetAdapterAdvancedProperty -Name $_.Name -RegistryKeyword "*TcpAckFrequency" -RegistryValue 1 } catch {}
            try { Set-NetAdapterAdvancedProperty -Name $_.Name -RegistryKeyword "*TCPNoDelay" -RegistryValue 1 } catch {}
            try { Set-NetAdapterAdvancedProperty -Name $_.Name -RegistryKeyword "*FlowControl" -RegistryValue 0 } catch {}
            try { Set-NetAdapterAdvancedProperty -Name $_.Name -RegistryKeyword "*InterruptModeration" -RegistryValue 0 } catch {}
          }
          Write-Host "[OK] TCP"

          # 6. UI strip
          $pers = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path $pers)) { New-Item -Path $pers -Force | Out-Null }
          Set-ItemProperty -Path $pers -Name "EnableTransparency" -Value 0
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x01,0x80,0x10,0x00,0x00,0x00))
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "DragFullWindows" -Value "0"
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0"
          Write-Host "[OK] UI strip"

          # 7. RDP + GPU + MMCSS
          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpTcp -Name "fMouseClicksDisabled" -Value 0
          Set-ItemProperty -Path $rdpTcp -Name "LatencySensitive" -Value 1
          $gfx = "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers"
          try { Set-ItemProperty -Path $gfx -Name "HwSchMode" -Value 2 } catch {}
          try { Set-ItemProperty -Path $gfx -Name "TdrLevel" -Value 0 } catch {}
          $mmcss = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          try { Set-ItemProperty -Path $mmcss -Name "NetworkThrottleQuota" -Value 0xFFFFFFFF } catch {}
          Write-Host "[OK] RDP/GPU/MMCSS"

          # 8. Game Mode + DWM
          $gameBar = "HKCU:\Software\Microsoft\GameBar"
          if (-not (Test-Path $gameBar)) { New-Item -Path $gameBar -Force | Out-Null }
          Set-ItemProperty -Path $gameBar -Name "AutoGameModeEnabled" -Value 1
          $dwm = "HKCU:\Software\Microsoft\Windows\DWM"
          try { Set-ItemProperty -Path $dwm -Name "EnableAeroPeek" -Value 0 } catch {}
          try { Set-ItemProperty -Path $dwm -Name "AlwaysHibernateThumbnails" -Value 0 } catch {}
          Write-Host "[OK] Game Mode"

          # 9. Flush DNS + trim working sets (single-line Add-Type, no here-string)
          ipconfig /flushdns | Out-Null
          $code = '[System.Runtime.InteropServices.DllImport("psapi.dll")] public static extern int EmptyWorkingSet(IntPtr hProcess);'
          Add-Type -Namespace Mem -Name PSet -MemberDefinition $code -ErrorAction SilentlyContinue
          Get-Process | ForEach-Object {
            try { [Mem.PSet]::EmptyWorkingSet($_.Handle) | Out-Null } catch {}
          }
          Write-Host "[OK] Memory trim"
          Write-Host "ALL OPTIMIZATIONS APPLIED"

      - name: Install + Up Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout | Out-Null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tailscale IPv4: $ip4"

      - name: Enable RDP user + firewall
        shell: pwsh
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
            Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: Display Hardware Info
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          $ram = Get-CimInstance Win32_ComputerSystem
          $totalRAM = [math]::Round($ram.TotalPhysicalMemory / 1GB, 2)
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RAM (GB): $totalRAM"
          Write-Host "Processor: $($cpu.Name)"
          Write-Host "Cores: $($cpu.NumberOfLogicalProcessors)"

      - name: Keep alive
        shell: pwsh
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }
